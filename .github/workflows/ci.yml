name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} / Illuminate ${{ matrix.illuminate }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.0'
            illuminate: '^9.52'
          - php: '8.1'
            illuminate: '^10.0'
          - php: '8.2'
            illuminate: '^11.0'
          - php: '8.3'
            illuminate: '^12.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Validate composer metadata
        run: composer validate --strict

      - name: Pin Illuminate version for matrix
        run: composer require illuminate/database:${{ matrix.illuminate }} --no-update --no-interaction

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Run tests
        run: composer test

      - name: Check code style
        run: composer cs:check

      - name: Audit dependencies
        run: composer security:audit

  static-analysis:
    name: Static analysis / PHPStan level 8
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Validate composer metadata
        run: composer validate --strict

      - name: Pin Illuminate version for static analysis
        run: composer require illuminate/database:^11.0 --no-update --no-interaction

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan
        run: composer analyse
